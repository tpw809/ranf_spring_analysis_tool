[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spring_analysis_tool"
version = "0.1.0"
description = "A Python package for mechanical spring analysis."
authors = [
    { name = "Timothy" }
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages]
find = { where = ["src"] }
